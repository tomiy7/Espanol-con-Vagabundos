name: courses

on:
  push:
    paths:
      - "Services/Courses/**"
      - "docker-compose*.yml"
      - ".github/workflows/courses.yml"
  pull_request:
    paths:
      - "Services/Courses/**"
      - "docker-compose*.yml"
      - ".github/workflows/courses.yml"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Unit + integracioni testovi nad pravim Postgres-om (sema iz EF modela; u produkciji je pravi Directus).
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COURSES_TEST_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Services/Courses/CoursesService.Tests -c Release
      - name: Tests
        run: dotnet test Services/Courses/CoursesService.Tests -c Release --no-build

  # Smoke: Docker image iz compose-a se podize i /health (baza) je zdrav.
  smoke:
    needs: test
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret-1234
    steps:
      - uses: actions/checkout@v4
      - name: Start courses.api (with coursesdb)
        run: docker compose up -d --build courses.api
      - name: Wait for health
        run: |
          for _ in $(seq 1 60); do
            if curl -fs "http://localhost:5002/health"; then exit 0; fi
            sleep 2
          done
          echo "courses.api did not become healthy" && exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs coursesdb courses.api
      - name: Tear down
        if: always()
        run: docker compose down -v
