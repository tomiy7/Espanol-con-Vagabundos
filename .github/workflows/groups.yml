name: groups

on:
  push:
    paths:
      - "Services/Groups/**"
      - "docker-compose*.yml"
      - ".github/workflows/groups.yml"
  pull_request:
    paths:
      - "Services/Groups/**"
      - "docker-compose*.yml"
      - ".github/workflows/groups.yml"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Unit + integracioni testovi (integracioni nad Postgres service kontejnerom).
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GROUPS_TEST_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: |
          for p in Domain.Tests Application.Tests Integration.Tests; do
            dotnet build "Services/Groups/GroupsService.$p" -c Release
          done
      - name: Domain tests
        run: dotnet test Services/Groups/GroupsService.Domain.Tests -c Release --no-build
      - name: Application tests
        run: dotnet test Services/Groups/GroupsService.Application.Tests -c Release --no-build
      - name: Integration tests
        run: dotnet test Services/Groups/GroupsService.Integration.Tests -c Release --no-build

  # Smoke: pravi Docker image iz compose-a (konfiguracija, migracija na startu, baza),
  # pa black-box testovi preko HTTP-a. Tajne su samo za CI i nisu prave.
  smoke:
    needs: test
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret-1234
      GROUPS_API_PORT: "5003"
      GROUPS_SMOKE_BASE_URL: http://localhost:5003
      GROUPS_SMOKE_JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Start groupsdb and groups.api
        run: docker compose up -d --build groupsdb groups.api
      - name: Wait for health
        run: |
          for _ in $(seq 1 60); do
            if curl -fs "$GROUPS_SMOKE_BASE_URL/health"; then exit 0; fi
            sleep 2
          done
          echo "groups.api did not become healthy" && exit 1
      - name: Smoke tests
        run: dotnet test Services/Groups/GroupsService.Smoke.Tests -c Release
      - name: Logs on failure
        if: failure()
        run: docker compose logs groupsdb groups.api
      - name: Tear down
        if: always()
        run: docker compose down -v
