services:
  
  authdb:
    image: postgres:16
    
  auth.api:
    image: auth.api
    build:
      context: .
      dockerfile: Services/Auth/AuthService.API/Dockerfile
    
  coursesdb:
    image: postgres:16
    
  courses.api:
    image: courses.api
    build: 
      context: .
      dockerfile: Services/Courses/CoursesService.API/Dockerfile
      
  paymentsdb:
    image: postgres:16
    
  directus:
    image: directus/directus:latest
    
  rabbitmq:
    image: rabbitmq:4-management-alpine

  groupsdb:
    image: postgres:16

  groups.api:
    image: groups.api
    build:
      context: .
      dockerfile: Services/Groups/GroupsService.API/Dockerfile

  notificationsdb:
    image: postgres:16

  mailpit:
    image: axllent/mailpit:latest

  notifications.api:
    image: notifications.api
    build:
      context: .
      dockerfile: Services/Notifications/NotificationsService.API/Dockerfile

volumes:
  auth_data:
  courses_data:
  groups_data:
  notifications_data:
  payments_data:
  rabbitmq_data:
    
networks:
  backend:
    driver: bridge