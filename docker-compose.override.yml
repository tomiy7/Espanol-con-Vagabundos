services:
  
  # DB for auth service
  authdb:
    container_name: authdb
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    restart: always
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - backend
        
  auth.api:
    container_name: auth.api
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__Default=Host=authdb;Port=5432;Database=authdb;Username=postgres;Password=${DB_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__AccessTokenMinutes=30
      - Jwt__RefreshTokenDays=60
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - authdb
    networks:
      - backend
    
  # DB for courses service + directus
  coursesdb:
    container_name: coursesdb
    environment:
      POSTGRES_DB: coursesdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    restart: always
    volumes:
      - courses_data:/var/lib/postgresql/data
    networks:
      - backend
        
  courses.api:
    container_name: courses.api
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__Default=Host=coursesdb;Port=5432;Database=coursesdb;Username=postgres;Password=${DB_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      # Courses pita Groups da li ucenik sme da otvori lekciju (GET /enrollments/access).
      - GroupsService__BaseUrl=http://groups.api:8080
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - coursesdb
    networks:
      - backend
  
  # Directus CMS
  directus:
    container_name: directus
    ports:
      - "8055:8055"
    environment:
      SECRET: ${DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: coursesdb
      DB_PORT: 5432
      DB_DATABASE: coursesdb
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
    depends_on:
      - coursesdb
    networks:
      - backend
        
  # Message broker (dogadjaji izmedju servisa); UI na http://localhost:15672
  rabbitmq:
    container_name: coursesite.rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-coursesite}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - backend

  # DB for groups service
  groupsdb:
    container_name: groupsdb
    environment:
      POSTGRES_DB: groupsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${GROUPS_DB_PORT:-5435}:5432"
    volumes:
      - groups_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d groupsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  groups.api:
    container_name: groups.api
    ports:
      - "${GROUPS_API_PORT:-5003}:8080"
    environment:
      - ConnectionStrings__Default=Host=groupsdb;Port=5432;Database=groupsdb;Username=postgres;Password=${DB_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - AuthService__BaseUrl=http://auth.api:8080
      - AuthService__ServiceAdminToken=${AUTH_SERVICE_ADMIN_TOKEN:-}
      - CoursesService__BaseUrl=http://courses.api:8080
      - Enrollment__PublicBaseUrl=http://localhost:${GROUPS_API_PORT:-5003}
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=${RABBITMQ_USER:-coursesite}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      # Development: API sam primenjuje migracije na startu.
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      groupsdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
        
  # DB for notifications service (evidencija poslatih mejlova)
  notificationsdb:
    container_name: notificationsdb
    environment:
      POSTGRES_DB: notificationsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${NOTIFICATIONS_DB_PORT:-5438}:5432"
    volumes:
      - notifications_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notificationsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # Lokalni SMTP koji hvata sve mejlove (nista ne ide napolje); UI na http://localhost:8025
  mailpit:
    container_name: coursesite.mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - backend

  notifications.api:
    container_name: notifications.api
    ports:
      - "${NOTIFICATIONS_API_PORT:-5004}:8080"
    environment:
      - ConnectionStrings__Default=Host=notificationsdb;Port=5432;Database=notificationsdb;Username=postgres;Password=${DB_PASSWORD}
      - AuthService__BaseUrl=http://auth.api:8080
      - AuthService__ServiceAdminToken=${AUTH_SERVICE_ADMIN_TOKEN:-}
      - CoursesService__BaseUrl=http://courses.api:8080
      - Notifications__FrontendBaseUrl=${FRONTEND_BASE_URL:-http://localhost:3000}
      - Smtp__Host=${SMTP_HOST:-mailpit}
      - Smtp__Port=${SMTP_PORT:-1025}
      - Smtp__UseSsl=${SMTP_USE_SSL:-false}
      - Smtp__UserName=${SMTP_USER:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromAddress=${SMTP_FROM:-no-reply@espanolconvagabundos.local}
      - Smtp__FromName=${SMTP_FROM_NAME:-Español con Vagabundos}
      - RabbitMq__HostName=rabbitmq
      - RabbitMq__UserName=${RABBITMQ_USER:-coursesite}
      - RabbitMq__Password=${RABBITMQ_PASSWORD}
      # Development: servis sam primenjuje migracije na startu.
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      notificationsdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - backend

  # DB for payments service
  paymentsdb:
    container_name: paymentsdb
    environment:
      POSTGRES_DB: paymentsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5436:5432"
    restart: always
    volumes:
      - payments_data:/var/lib/postgresql/data
    networks:
      - backend
